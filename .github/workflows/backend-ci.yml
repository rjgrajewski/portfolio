name: backend-ci

on:
  push:
    branches: [prod, dev]
  pull_request:

jobs:
  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Type-check the Lambdas. esbuild (via cdk synth below) strips types
      # without checking them, so this is the only gate on the functions'
      # type correctness. Both share backend/functions/shared/.
      - run: npm run typecheck --workspace=@portfolio/agent-fn
      - run: npm run typecheck --workspace=@portfolio/credentials-fn

      # cdk synth — no AWS credentials needed (env is a fixed account/region
      # in backend/infra/lib/config.ts, no context lookups). This also runs
      # the NodejsFunction esbuild bundle + the content copy hook, so it
      # catches a broken bundle too. Deploy stays manual
      # (docs/ARCHITECTURE.md § Dev / prod separation) — infra changes are
      # always deliberate, never pushed automatically.
      - run: npm run synth --workspace=backend/infra
