version: 1
# Frontend only — see docs/ARCHITECTURE.md § Hosting. Static SPA inside an
# npm-workspaces monorepo: everything runs from the repo root, where the
# workspaces and lockfile live, and the artifact path points into frontend/.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build --workspace=frontend
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
